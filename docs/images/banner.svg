<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="GlobeTrotter — plan the route, know the cost, share the story">
  <title>GlobeTrotter</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="55%" stop-color="#101830"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>

    <radialGradient id="bloom" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#36D6C3" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#36D6C3" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#F2EEE3" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <!-- The route. Everything else hangs off this one path.
         pathLength lives here, not on the <use> below: it is a geometry
         attribute of the path, so a <use> would ignore it and the dash array
         would be interpreted against the real length — drawing the line as
         disconnected dashes instead of a single stroke. -->
    <path id="route" pathLength="100"
          d="M150 214 A380 380 0 0 1 430 132 A360 360 0 0 1 740 176 A340 340 0 0 1 1055 96"/>
  </defs>

  <style>
    /* pathLength="100" makes the draw normalised, so the geometry above can be
       retuned without touching any of these timings. */
    .line {
      stroke-dasharray: 100;
      animation: draw 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes draw {
      0%   { stroke-dashoffset: 100; opacity: 0; }
      6%   { opacity: 1; }
      42%  { stroke-dashoffset: 0;   opacity: 1; }
      88%  { stroke-dashoffset: 0;   opacity: 1; }
      100% { stroke-dashoffset: 0;   opacity: 0; }
    }

    .node   { animation: pop 7s cubic-bezier(0.22, 1, 0.36, 1) infinite; transform-box: fill-box; transform-origin: center; }
    .node-2 { animation-delay: 0.55s; }
    .node-3 { animation-delay: 1.15s; }
    .node-4 { animation-delay: 1.75s; }
    @keyframes pop {
      0%, 4%  { opacity: 0; transform: scale(0); }
      12%     { opacity: 1; transform: scale(1.4); }
      18%     { opacity: 1; transform: scale(1); }
      88%     { opacity: 1; transform: scale(1); }
      100%    { opacity: 0; transform: scale(1); }
    }

    .label   { animation: fade 7s ease-in-out infinite; }
    .label-2 { animation-delay: 0.55s; }
    .label-3 { animation-delay: 1.15s; }
    .label-4 { animation-delay: 1.75s; }
    @keyframes fade {
      0%, 8% { opacity: 0; }
      20%    { opacity: 0.62; }
      88%    { opacity: 0.62; }
      100%   { opacity: 0; }
    }

    .word { animation: rise 7s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    @keyframes rise {
      0%, 24% { opacity: 0; transform: translateY(14px); }
      38%     { opacity: 1; transform: translateY(0); }
      90%     { opacity: 1; transform: translateY(0); }
      100%    { opacity: 0; transform: translateY(0); }
    }

    .tag { animation: fade-tag 7s ease-in-out infinite; }
    @keyframes fade-tag {
      0%, 34% { opacity: 0; }
      48%     { opacity: 0.55; }
      90%     { opacity: 0.55; }
      100%    { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .line, .node, .label, .word, .tag { animation: none; opacity: 1; stroke-dashoffset: 0; }
    }
  </style>

  <rect width="1200" height="340" fill="url(#sky)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#bloom)"/>

  <!-- Glow beneath the line, so it reads as luminous rather than drawn. -->
  <use href="#route" class="line" stroke="#36D6C3" stroke-width="9" stroke-opacity="0.18"
       fill="none" stroke-linecap="round" filter="url(#soft)"/>
  <use href="#route" class="line" stroke="#36D6C3" stroke-width="2.6"
       fill="none" stroke-linecap="round"/>

  <!-- The head of the route, riding the same path. -->
  <circle r="5" fill="#F2EEE3" opacity="0">
    <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;1;1;1" keyTimes="0;0.42;0.88;1" calcMode="linear">
      <mpath href="#route"/>
    </animateMotion>
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite"
             values="0;1;1;0;0" keyTimes="0;0.08;0.42;0.5;1"/>
  </circle>

  <!-- Origin is Solar (money starts here); the rest of the route is Lagoon. -->
  <g>
    <circle class="node" cx="150" cy="214" r="7.5" fill="#F5B62B"/>
    <circle class="node node-2" cx="430" cy="132" r="6" fill="#36D6C3"/>
    <circle class="node node-3" cx="740" cy="176" r="6" fill="#36D6C3"/>
    <circle class="node node-4" cx="1055" cy="96" r="6" fill="#36D6C3"/>
  </g>

  <g font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace"
     font-size="13" letter-spacing="2.6" fill="#F2EEE3" text-anchor="middle">
    <text class="label"          x="150"  y="190">PARIS</text>
    <text class="label label-2"  x="430"  y="108">TOKYO</text>
    <text class="label label-3"  x="740"  y="152">NEW YORK</text>
    <text class="label label-4"  x="1055" y="72">ROME</text>
  </g>

  <text class="word" x="600" y="278" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="600"
        letter-spacing="-1.5" fill="#F2EEE3">Globe<tspan fill="#F5B62B">Trotter</tspan></text>

  <text class="tag" x="600" y="312" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace"
        font-size="13" letter-spacing="4.5" fill="#9AA3B5">PLAN THE ROUTE · KNOW THE COST · SHARE THE STORY</text>
</svg>
