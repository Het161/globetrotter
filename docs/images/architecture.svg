<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" role="img" aria-label="GlobeTrotter architecture — browser, App Router, services, pure engine, Prisma and PostgreSQL as stacked isometric layers">
  <title>GlobeTrotter — technical architecture</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>

    <pattern id="mesh" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#F2EEE3" stroke-opacity="0.035"/>
    </pattern>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <style>
    .slab      { animation: float 9s ease-in-out infinite; }
    .slab-1 { animation-delay: 0s }   .slab-2 { animation-delay: .5s }
    .slab-3 { animation-delay: 1s }   .slab-4 { animation-delay: 1.5s }
    .slab-5 { animation-delay: 2s }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-7px); }
    }

    /* Data falling down the stack: request in, rows back out. */
    .spark { animation: fall 3.4s cubic-bezier(0.4,0,0.6,1) infinite; }
    .spark-b { animation-delay: 1.7s }
    @keyframes fall {
      0%   { opacity: 0; transform: translateY(-10px); }
      12%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(600px); }
    }

    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.20 } 50% { opacity:.48 } }

    @media (prefers-reduced-motion: reduce) {
      .slab, .spark, .pulse { animation: none; }
      .spark { opacity: 0; }
    }

    text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .name  { font-size: 21px; font-weight: 650; fill: #F2EEE3; }
    .desc  { font-size: 14px; fill: #9AA3B5; }
    .tagm  { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11.5px; letter-spacing: 2px; }
  </style>

  <rect width="1180" height="900" fill="url(#bg)"/>
  <rect width="1180" height="900" fill="url(#mesh)"/>

  <text class="tagm" x="60" y="56" fill="#9AA3B5" letter-spacing="4">TECHNICAL ARCHITECTURE</text>
  <text x="60" y="96" font-family="Georgia, serif" font-size="34" font-weight="600" fill="#F2EEE3">
    One direction of travel
  </text>
  <text class="desc" x="60" y="124">
    Every read goes down the stack and back. Nothing skips a layer.
  </text>

  <!-- The descent gutter, in the clear strip left of the slabs (they start at
       x=80). It sat at x=360 first, dead centre — but the slab faces are opaque
       and painted after it, so both sparks were drawn and then covered. -->
  <line x1="46" y1="176" x2="46" y2="856" stroke="#36D6C3" stroke-opacity="0.22" stroke-width="2"/>
  <circle class="spark"         cx="46" cy="186" r="4" fill="#36D6C3"/>
  <circle class="spark spark-b" cx="46" cy="186" r="4" fill="#F5B62B"/>

  <!-- ============ Layer 1 — Browser ============ -->
  <g class="slab slab-1">
    <path d="M360 150 L640 224 L360 298 L80 224 Z" fill="#151d33" stroke="#36D6C3" stroke-opacity="0.45" stroke-width="1.5"/>
    <path d="M80 224 L360 298 L360 322 L80 248 Z" fill="#0b1120" stroke="#36D6C3" stroke-opacity="0.22"/>
    <path d="M360 298 L640 224 L640 248 L360 322 Z" fill="#101830" stroke="#36D6C3" stroke-opacity="0.22"/>
    <text class="tagm" x="360" y="230" fill="#36D6C3" text-anchor="middle">CLIENT COMPONENTS</text>
  </g>
  <text class="name" x="700" y="212">Browser</text>
  <text class="desc" x="700" y="238">Optimistic mutations, rolled back on failure.</text>
  <text class="desc" x="700" y="258">Runs the budget engine locally for a live total.</text>

  <!-- ============ Layer 2 — App Router ============ -->
  <g class="slab slab-2">
    <path d="M360 288 L640 362 L360 436 L80 362 Z" fill="#151d33" stroke="#36D6C3" stroke-opacity="0.45" stroke-width="1.5"/>
    <path d="M80 362 L360 436 L360 460 L80 386 Z" fill="#0b1120" stroke="#36D6C3" stroke-opacity="0.22"/>
    <path d="M360 436 L640 362 L640 386 L360 460 Z" fill="#101830" stroke="#36D6C3" stroke-opacity="0.22"/>
    <text class="tagm" x="360" y="368" fill="#36D6C3" text-anchor="middle">RSC PAGES · 36 ROUTE HANDLERS</text>
  </g>
  <text class="name" x="700" y="350">Next.js App Router</text>
  <text class="desc" x="700" y="376">Pages call services directly — no HTTP hop.</text>
  <text class="desc" x="700" y="396">Every handler wrapped in one withApi() envelope.</text>

  <!-- ============ Layer 3 — Services ============ -->
  <g class="slab slab-3">
    <path d="M360 426 L640 500 L360 574 L80 500 Z" fill="#151d33" stroke="#36D6C3" stroke-opacity="0.45" stroke-width="1.5"/>
    <path d="M80 500 L360 574 L360 598 L80 524 Z" fill="#0b1120" stroke="#36D6C3" stroke-opacity="0.22"/>
    <path d="M360 574 L640 500 L640 524 L360 598 Z" fill="#101830" stroke="#36D6C3" stroke-opacity="0.22"/>
    <text class="tagm" x="360" y="506" fill="#36D6C3" text-anchor="middle">SERVICES · server-only</text>
  </g>
  <text class="name" x="700" y="488">Service layer</text>
  <text class="desc" x="700" y="514">The only code that touches Prisma.</text>
  <text class="desc" x="700" y="534">All access control in one assertTripAccess().</text>

  <!-- ============ Layer 4 — Engine (the highlighted one) ============ -->
  <ellipse cx="360" cy="638" rx="300" ry="86" fill="#F5B62B" opacity="0.13" filter="url(#glow)" class="pulse"/>
  <g class="slab slab-4">
    <path d="M360 564 L640 638 L360 712 L80 638 Z" fill="#1c1a2b" stroke="#F5B62B" stroke-opacity="0.75" stroke-width="2"/>
    <path d="M80 638 L360 712 L360 736 L80 662 Z" fill="#120f1c" stroke="#F5B62B" stroke-opacity="0.3"/>
    <path d="M360 712 L640 638 L640 662 L360 736 Z" fill="#171528" stroke="#F5B62B" stroke-opacity="0.3"/>
    <text class="tagm" x="360" y="638" fill="#F5B62B" text-anchor="middle">PURE ENGINE · NO I/O</text>
    <text class="tagm" x="360" y="660" fill="#9AA3B5" text-anchor="middle" letter-spacing="1">budget.ts · stop-dates.ts</text>
  </g>
  <text class="name" x="700" y="620" fill="#F5B62B">The engine</text>
  <text class="desc" x="700" y="646">Plain numbers in, plain numbers out — so it is</text>
  <text class="desc" x="700" y="666">unit-tested <tspan fill="#F2EEE3">and</tspan> runs in the browser. One</text>
  <text class="desc" x="700" y="686">implementation, so the two can never disagree.</text>

  <!-- ============ Layer 5 — Postgres ============ -->
  <g class="slab slab-5">
    <path d="M360 702 L640 776 L360 850 L80 776 Z" fill="#151d33" stroke="#36D6C3" stroke-opacity="0.45" stroke-width="1.5"/>
    <path d="M80 776 L360 850 L360 874 L80 800 Z" fill="#0b1120" stroke="#36D6C3" stroke-opacity="0.22"/>
    <path d="M360 850 L640 776 L640 800 L360 874 Z" fill="#101830" stroke="#36D6C3" stroke-opacity="0.22"/>
    <text class="tagm" x="360" y="782" fill="#36D6C3" text-anchor="middle">PRISMA 6 → POSTGRESQL 15</text>
  </g>
  <text class="name" x="700" y="764">Database</text>
  <text class="desc" x="700" y="790">11 normalised tables. Money in Decimal, dates</text>
  <text class="desc" x="700" y="810">as @db.Date, search on pg_trgm GIN indexes.</text>

  <!-- Boundary note. The size overrides are an inline `style`, not
       `font-size=`/`letter-spacing=` attributes: presentation attributes lose
       to any stylesheet rule, so `.tagm` above kept winning and the text stayed
       at 11.5px/2px and ran off the right edge of the canvas. The rect width is
       the measured getComputedTextLength() plus padding, not an estimate. -->
  <g transform="translate(700, 852)">
    <rect x="-6" y="-22" width="374" height="34" rx="8" fill="#F5B62B" fill-opacity="0.07" stroke="#F5B62B" stroke-opacity="0.28"/>
    <text class="tagm" x="10" y="0" fill="#F5B62B"
          style="font-size:10.5px; letter-spacing:0.4px">DTO BOUNDARY — no Decimal or Date leaves the server</text>
  </g>
</svg>
